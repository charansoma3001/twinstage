name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the bridge smoke test runs the drivers in dry run
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  drivers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drivers
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev ruff check .
      - run: uv run --group dev pytest -q
